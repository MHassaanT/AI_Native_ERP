[package]
name = "ledger_core"
version = "0.1.0"
edition = "2021"
authors = ["AI-Native ERP Architecture Team"]
description = "Deterministic zero-sum invariant ledger verification core"

[dependencies]
rust_decimal = { version = "1.35", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[lib]
crate-type = ["cdylib", "rlib"]
